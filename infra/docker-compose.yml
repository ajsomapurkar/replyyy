services:
  postgres:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: relay, POSTGRES_PASSWORD: relay, POSTGRES_DB: relay }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U relay"], interval: 3s, retries: 20 }
    volumes: [relay-pg:/var/lib/postgresql/data, ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql]
  # Optional — Relay runs in PostgreSQL-only mode by default (PostGIS GiST index for driver locations).
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: [redis]
volumes: { relay-pg: {} }
